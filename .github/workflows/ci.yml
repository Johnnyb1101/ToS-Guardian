name: CI

# The full suite includes native Windows path and junction checks.
# Keep their temporary fixtures on the Windows system drive.
# The extension has no runtime/dev dependencies, so there is nothing to install.

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
      - name: Run tests
        shell: pwsh
        run: |
          $systemDrive = [IO.Path]::GetPathRoot($env:SystemRoot)
          $testTemp = Join-Path $systemDrive ('tos-guardian-ci-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $testTemp -ErrorAction Stop | Out-Null
          $env:TEMP = $testTemp
          $env:TMP = $testTemp
          npm.cmd test
          exit $LASTEXITCODE
