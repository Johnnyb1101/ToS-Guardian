name: CI

# The full suite includes native Windows path and junction checks.
# Keep source and temporary fixtures together on the Windows system drive;
# replay tests use relative paths, which cannot span Windows drives.
# The extension has no runtime/dev dependencies, so there is nothing to install.

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
      - name: Run tests
        shell: pwsh
        run: |
          $systemDrive = [IO.Path]::GetPathRoot($env:SystemRoot)
          $testRoot = Join-Path $systemDrive ('tos-guardian-ci-' + [guid]::NewGuid().ToString('N'))
          $testSource = Join-Path $testRoot 'source'
          $testTemp = Join-Path $testRoot 'temp'
          New-Item -ItemType Directory -Path $testTemp -ErrorAction Stop | Out-Null
          $sourceArchive = Join-Path $testRoot 'source.zip'
          git archive --format=zip --output=$sourceArchive HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath $sourceArchive -DestinationPath $testSource -ErrorAction Stop
          $env:TEMP = $testTemp
          $env:TMP = $testTemp
          Set-Location -LiteralPath $testSource -ErrorAction Stop
          npm.cmd test
          exit $LASTEXITCODE
